x-app: &app
  image: ${APP_IMAGE:-ghcr.io/dentest-project/client:latest}
  restart: unless-stopped
  stop_grace_period: 60s
  environment:
    API_URL: ${API_URL:-https://api.dentest.tech}
    NUXT_PUBLIC_API_URL: ${API_URL:-https://api.dentest.tech}
    KETAL_URL: ${KETAL_URL:-https://ketal.dentest.tech/rpc}
    NUXT_PUBLIC_KETAL_URL: ${KETAL_URL:-https://ketal.dentest.tech/rpc}
    HOST: 0.0.0.0
    NITRO_HOST: 0.0.0.0
    NITRO_PORT: 3000
  healthcheck:
    test:
      - CMD-SHELL
      - 'node -e "fetch(''http://127.0.0.1:3000/healthz'').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"'
    interval: 5s
    timeout: 3s
    retries: 24
    start_period: 10s
  extra_hosts:
    - host.docker.internal:host-gateway
    - ${API_HOST:-api.dentest.local}:host-gateway

services:
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - target: 80
        published: ${HTTP_PORT:-80}
        protocol: tcp
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  app_blue:
    <<: *app

  app_green:
    <<: *app
