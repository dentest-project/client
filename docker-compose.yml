services:
  node:
    build:
      context: .
      target: app_node
      args:
        API_URL: ${API_URL:-http://api.dentest.local}
        KETAL_URL: ${KETAL_URL:-http://ketal.dentest.local/rpc}
    environment:
      NODE_OPTIONS: '--openssl-legacy-provider'
      HOST: '0.0.0.0'
      API_URL: ${API_URL:-http://api.dentest.local}
      KETAL_URL: ${KETAL_URL:-http://ketal.dentest.local/rpc}
    command: npm start
    ports:
      - ${HTTP_PORT:-80}:3000
      - 24678:24678
    stdin_open: true
